<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>काव्य संग्रह | गुरुप्रताप शर्मा 'आग'</title>

  <!-- Google Fonts: Fanwood Text, Lora, Tiro Devanagari Hindi, Quicksand, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Quicksand:wght@500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       LEONA DESIGN SYSTEM & COLOR TOKENS
       ============================================ */
    :root {
      --leona-terracotta: #F66E5E;
      --leona-terracotta-dark: #D95343;
      --leona-teal: #39BAAF;
      --leona-teal-dark: #2C988F;
      --leona-charcoal: #1E1B18;
      --leona-charcoal-light: #2A2622;
      --leona-ivory: #FAF7F2;
      --leona-cream: #F4EFE6;
      --leona-white: #FFFFFF;
      --leona-gold: #D4AF37;
      --leona-text-main: #2C2622;
      --leona-text-muted: #6E665E;
      
      --font-serif: 'Lora', 'Tiro Devanagari Hindi', 'Fanwood Text', Georgia, serif;
      --font-sans: 'Inter', 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-hindi: 'Tiro Devanagari Hindi', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--leona-ivory);
      color: var(--leona-text-main);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* Sticky Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(250, 247, 242, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 215, 197, 0.6);
      transition: all 0.3s ease;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--leona-charcoal);
    }

    .brand-logo img {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-title .accent {
      color: var(--leona-terracotta);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--leona-text-main);
      position: relative;
      padding: 6px 0;
      transition: color 0.3s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--leona-terracotta);
      transition: width 0.3s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--leona-terracotta);
    }

    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-lang {
      padding: 6px 16px;
      border: 1.5px solid var(--leona-charcoal);
      border-radius: 20px;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-lang:hover {
      border-color: var(--leona-terracotta);
      color: var(--leona-terracotta);
      background: var(--leona-cream);
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, var(--leona-ivory) 0%, var(--leona-cream) 100%);
      padding: 50px 0 35px;
      text-align: center;
      border-bottom: 1px solid rgba(226, 215, 197, 0.8);
    }

    .banner-title {
      font-family: var(--font-serif);
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--leona-charcoal);
      margin-bottom: 10px;
    }

    .banner-subtitle {
      font-size: 1.1rem;
      color: var(--leona-text-muted);
      max-width: 680px;
      margin: 0 auto;
    }

    /* Filter Tabs */
    .filter-tabs-wrapper {
      padding: 24px 0 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filter-tab {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(226, 215, 197, 0.9);
      background: var(--leona-white);
      color: var(--leona-text-main);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-tab:hover, .filter-tab.active {
      background: var(--leona-terracotta);
      color: #FFFFFF;
      border-color: var(--leona-terracotta);
      box-shadow: 0 4px 14px rgba(246, 110, 94, 0.3);
    }

    /* Poems Grid Section */
    .poems-listing-section {
      flex: 1;
      padding: 30px 0 70px;
    }

    .poems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
    }

    .poem-card {
      background: var(--leona-white);
      border-radius: 12px;
      padding: 32px 28px;
      border: 1px solid rgba(226, 215, 197, 0.8);
      box-shadow: 0 8px 25px rgba(30, 27, 24, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      position: relative;
    }

    .poem-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(30, 27, 24, 0.1);
      border-color: var(--leona-gold);
    }

    .poem-collection-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--leona-terracotta-dark);
      background: rgba(246, 110, 94, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      width: fit-content;
      margin-bottom: 14px;
    }

    .poem-card-title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--leona-charcoal);
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .poem-card-excerpt {
      font-family: var(--font-hindi);
      font-size: 1.02rem;
      color: var(--leona-text-main);
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .poem-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px dashed rgba(226, 215, 197, 0.8);
    }

    .read-poem-link {
      color: var(--leona-terracotta);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .read-poem-link:hover {
      color: var(--leona-terracotta-dark);
      transform: translateX(4px);
    }

    /* Footer */
    .footer {
      background: var(--leona-charcoal);
      color: var(--leona-ivory);
      padding: 16px 0;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }

    .footer .container {
      max-width: 880px;
      margin: 0 auto;
    }

    .footer-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-copyright {
      font-size: 0.88rem;
      color: rgba(250, 247, 242, 0.75);
    }

    .footer-social-icons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .social-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #8E867E;
      text-decoration: none;
      padding: 4px;
      transition: all 0.3s ease;
    }

    .social-icon-btn:hover {
      color: var(--leona-terracotta);
      transform: translateY(-2px);
    }

    .footer-admin-link {
      color: rgba(250, 247, 242, 0.7);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid rgba(250, 247, 242, 0.2);
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    .footer-admin-link:hover {
      color: var(--leona-gold);
      border-color: var(--leona-gold);
      background: rgba(212, 175, 55, 0.1);
    }
  </style>
</head>

  <script>
    const SUPABASE_URL = "https://dxucmtfuyfobvcqxtnmz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4dWNtdGZ1eWZvYnZjcXh0bm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwOTAxOTksImV4cCI6MjA3NzY2NjE5OX0.5qZ4MpbTUMKxG_2jixq1KAXs4nh580h4Nxf4NaBEE6U";

    async function fetchSupabaseData(table) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return (data && data.length > 0) ? data : null;
      } catch (err) {
        console.info(`Supabase API notice for ${table}: using active rendering engine.`);
        return null;
      }
    }

    const poemsList = [
      {
        id: "1",
        slug: "agni-path-ki-or",
        title: "अग्निपथ की ओर",
        collection: "अग्नि कलश",
        excerpt: `"उठो हे वीर सम्मुख काल है खड़ा,\nप्रदीप्त हो रहा समस्त व्योम है।\nन डगमगाओ विपदा की घनी घटा में,\nसत्य की समिधा से प्रज्वलित यह होम है।"`
      },
      {
        id: "2",
        slug: "matribhumi-ka-naman",
        title: "मातृभूमि का नमन",
        collection: "मातृभूमि का नमन",
        excerpt: `"शिरोमणि बना रहे सदैव यह शिखर,\nतुम्हारा प्रेम ही हमारा प्राण है।\nहे मातृभूमि तेरे पावन चरणों में,\nहमारा सर्वस्व आज कुर्बान है।"`
      },
      {
        id: "3",
        slug: "chetna-ka-savera",
        title: "चेतना का सवेरा",
        collection: "चेतना के स्वर",
        excerpt: `"अंधेरा छट रहा प्रभात आ गया,\nनव्य दीप जला प्रदीप्त ज्ञान का।\nअज्ञान की रात अब ढल चुकी है,\nसंगीत गूंज उठा नव विधान का।"`
      },
      {
        id: "4",
        slug: "vishwa-shanti-prarthana",
        title: "अंतर की ज्वाला",
        collection: "अग्नि कलश",
        excerpt: `"हृदय में जल रही जो ज्योति पावन,\nवही पथ दीप बनकर जगमगाएगी।\nकठिन हो राह कितनी भी समय की,\nमनुज की भावना ही रंग लाएगी।"`
      },
      {
        id: "5",
        slug: "veertan-ka-sangram",
        title: "वीर प्रसूता माटी",
        collection: "मातृभूमि का नमन",
        excerpt: `"इस मिट्टी के कण-कण में समाया अमर ओज,\nवीरों के रक्त से सिंचित यह पावन भूमि रोज।\nसौगंध हमें इस पावन धरा की हम झुकने न देंगे,\nविजय की पताका गगन में लहराएंगे रोज।"`
      },
      {
        id: "6",
        slug: "manavta-ka-gaan",
        title: "मानवता का गान",
        collection: "अंतर्मन की गूँज",
        excerpt: `"भेदभाव की दीवारों को तोड़कर आज खड़े हों,\nप्रेम और समरसता की राह पर निरंतर आगे बढ़ें।\nहर प्राणी में जो ज्योति जलती सत्य की वही ईश्वर है,\nमानवता के अमर मंत्र को हृदय में धारण करें।" `
      }
    ];

    function renderPoems(filter = 'all') {
      const container = document.getElementById('poemsContainer');
      const filtered = filter === 'all' ? poemsList : poemsList.filter(p => p.collection === filter);

      container.innerHTML = filtered.map(p => `
        <article class="poem-card">
          <div>
            <span class="poem-collection-badge">${p.collection}</span>
            <h3 class="poem-card-title">${p.title}</h3>
            <p class="poem-card-excerpt">${p.excerpt}</p>
          </div>
          <div class="poem-card-footer">
            <a href="/kavya-sangrah/${p.slug}.html" class="read-poem-link">
              ${currentLang === 'en' ? 'Read Poem →' : 'काव्य पढ़ें →'}
            </a>
          </div>
        </article>
      `).join('');
    }

    function filterPoems(category, btn) {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPoems(category);
    }

    // Language switcher
    let currentLang = localStorage.getItem('lang') || 'hi';
    function updateLangUI() {
      document.getElementById('btnLang').innerText = currentLang === 'hi' ? 'HI / EN' : 'EN / HI';
      if (currentLang === 'en') {
        document.getElementById('navHome').innerText = 'Home';
        document.getElementById('navAbout').innerText = 'About Poet';
        document.getElementById('navPoems').innerText = 'Poetry Collections';
        document.getElementById('navBooks').innerText = 'Publications';
        document.getElementById('navContact').innerText = 'Contact';
        document.getElementById('pageTitle').innerText = 'Complete Poetry Collections';
        document.getElementById('pageSubtitle').innerText = 'All timeless poetry collections and verses by Gurupratap Sharma "Aag"';
      } else {
        document.getElementById('navHome').innerText = 'मुख्य पृष्ठ';
        document.getElementById('navAbout').innerText = 'कवि परिचय';
        document.getElementById('navPoems').innerText = 'काव्य संग्रह';
        document.getElementById('navBooks').innerText = 'प्रकाशन';
        document.getElementById('navContact').innerText = 'संपर्क';
        document.getElementById('pageTitle').innerText = 'समग्र काव्य संग्रह';
        document.getElementById('pageSubtitle').innerText = 'कवि गुरुप्रताप शर्मा "आग" की सम्पूर्ण कालजयी काव्य रचनाएँ एवं कविताएं';
      }
      renderPoems();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'hi' ? 'en' : 'hi';
      localStorage.setItem('lang', currentLang);
      updateLangUI();
    }

    async function loadLivePoems() {
      try {
        const livePoems = await fetchSupabaseData('poems');
        if (livePoems && livePoems.length > 0) {
          poemsList = livePoems.map((p, idx) => {
            const title = p.heading_hi || p.heading_en || p.heading || p.title || 'काव्य रचना';
            const body = p.body_text_hi || p.body_text_en || p.description || (p.full_text ? p.full_text.substring(0, 100) + '...' : '');
            return {
              id: p.id || String(idx + 1),
              slug: p.slug || `poem-${p.id || idx + 1}`,
              title: title,
              collection: p.category || p.collection || 'काव्य संग्रह',
              excerpt: body ? (body.length > 120 ? body.substring(0, 120) + '...' : body) : ''
            };
          });
          renderPoems();
        }
      } catch (err) {
        console.warn('Live poems fetch notice:', err);
      }
    }

    updateLangUI();
    loadLivePoems();
  </script>
</body>
</html>
